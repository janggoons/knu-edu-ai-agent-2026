</style></head><body><div class="bespoke-marp-osc"><button data-bespoke-marp-osc="prev" tabindex="-1" title="Previous slide">Previous slide</button><span data-bespoke-marp-osc="page"></span><button data-bespoke-marp-osc="next" tabindex="-1" title="Next slide">Next slide</button><button data-bespoke-marp-osc="fullscreen" tabindex="-1" title="Toggle fullscreen (f)">Toggle fullscreen</button><button data-bespoke-marp-osc="overview" tabindex="-1" title="Toggle overview view (o)">Toggle overview view</button><button data-bespoke-marp-osc="presenter" tabindex="-1" title="Open presenter view (p)">Open presenter view</button></div><div id=":$p"><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="1" data-class="lead" data-theme="default" data-style="@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap');
section {
  font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: #FAFAF8;
  color: #1E1B2E;
  padding: 56px 68px;
  font-size: 27px;
}
h1 {
  font-size: 46px;
  font-weight: 900;
  color: #1E1B2E;
  margin-bottom: 6px;
}
h2 {
  font-size: 34px;
  font-weight: 700;
  color: #4338CA;
  margin-bottom: 14px;
}
h3 {
  font-size: 27px;
  font-weight: 700;
  color: #EA580C;
}
strong { color: #4338CA; }
em { color: #EA580C; font-style: normal; font-weight: 700; }
section.lead {
  background: linear-gradient(135deg, #312E81 0%, #4338CA 55%, #6D28D9 100%);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.lead h1 { color: #FFFFFF; font-size: 52px; }
section.lead h2 { color: #FDE68A; }
section.lead p { color: #E0E7FF; }
section.part {
  background: #1E1B2E;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.part h1 { color: #FFFFFF; font-size: 54px; }
section.part .badge {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: #F97316;
  color: #1E1B2E;
  font-size: 44px;
  font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
section.part .msg { color: #C7D2FE; font-size: 26px; margin-top: 10px; }
section.break {
  background: #FDF4E3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
section.break h1 { font-size: 60px; color: #EA580C; }
section.qa {
  background: #EEF2FF;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
.card {
  background: #FFFFFF;
  border: 2px solid #E5E7EB;
  border-radius: 16px;
  padding: 20px 24px;
}
.card.bad { border-color: #FCA5A5; background: #FEF2F2; }
.card.good { border-color: #86EFAC; background: #F0FDF4; }
.tag {
  display: inline-block;
  background: #4338CA;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.tag.orange { background: #EA580C; }
.tag.green { background: #16A34A; }
.tag.red { background: #DC2626; }
.tag.gray { background: #6B7280; }
.big { font-size: 40px; font-weight: 900; color: #4338CA; }
.center { text-align: center; }
.small { font-size: 20px; color: #6B7280; }
.warn {
  background: #FEF3C7;
  border-left: 8px solid #F59E0B;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 24px;
}
img { border-radius: 10px; }

<p>'slop'은 메리엄-웹스터가 고른 2025년 올해의 단어입니다. 뜻은 &quot;주로 AI로 대량 생산되는 질 낮은 디지털 콘텐츠&quot;.</p>
<p>새 유튜브 계정에 뜬 쇼츠 첫 500개 중 <strong>21%</strong>가 AI 생성물이었습니다. 인기 AI 슬롭 채널 조회수는 <em>한국이 세계 1위</em>였습니다 (11개 채널, 약 84.5억 회)</p>

</div>

<div class="grid3" style="margin-top:12px">

<p>지금까지는 <strong>내가 물어야</strong> 움직였습니다</p>
<p>Duet은 챙길 일이 생기면 <em>먼저 연락</em>합니다</p>
</div>
<div class="card">
<p><span class="tag orange">일하는 방식</span></p>
<ul>
<li>아침마다 <strong>짧은 브리핑</strong></li>
<li>연결된 앱을 <strong>몇 시간마다</strong> 살피고, 필요할 때만 메시지</li>
<li>따로 쓰는 <strong>가상 컴퓨터·브라우저</strong>가 있어 노트북을 꺼도 일함</li>
</ul>

<li>증권 거래·계좌 간 이체는 승인해도 <strong>하지 않음</strong></li>
<li>비밀번호는 보지 않고, 카드·신분증 번호는 내보내지 않음</li>
</ul>

<div class="grid2">
<div>
<p><strong>Claude Code</strong>는 내 컴퓨터의 폴더를 읽고, 파일을 만들고 고치는 에이전트입니다. 폴더에 있는 <code>CLAUDE.md</code>(지침 한 장)를 먼저 읽고 일합니다.</p>
<ol>
<li><strong>claude.com/download</strong> 에서 Claude 데스크톱 앱 설치 (macOS · Windows)</li>
<li>받으신 Claude 계정으로 로그인 → <strong>Code</strong> 탭</li>
<li>내려받은 <strong>실습 폴더</strong> 선택</li>
<li>파일을 고치기 전에 묻는 기본 권한 그대로 시작</li>
</ol>
<p class="small">데스크톱 앱 안에 Claude Code가 들어 있어 따로 설치하지 않아도 됩니다(VS Code 확장으로도 쓸 수 있음). 유료 구독(Pro·Max 등)이 필요합니다</p>

<div>

<h2 id="%EC%8B%A4%EC%8A%B5-%EC%A4%80%EB%B9%84-%E2%91%A1-ai-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80-aside%EC%97%90-claude-%EC%97%B0%EA%B2%B0">실습 준비 ② AI 브라우저 Aside에 Claude 연결</h2>
<div class="grid2">
<div>
<p><strong>Aside</strong>는 사람과 에이전트가 함께 쓰도록 만든 브라우저입니다. 로그인해 둔 사이트에서 에이전트가 직접 페이지를 읽고 일합니다.</p>
<ol>
<li><strong>aside.com/download</strong> 에서 내려받아 설치 (macOS 15 이상 · Windows)</li>
<li>계정 만들기 → 브라우저 데이터 가져오기는 <em>오늘은 건너뛰기</em></li>
<li><code>Settings &gt; Models &gt; Providers &gt; Connect</code> → <strong>Subscription</strong> → <strong>Claude Subscription</strong> → 팝업에서 Claude 로그인</li>
<li><code>Settings &gt; Models &gt; Task models</code>에서 기본 모델을 <strong>Claude</strong>로</li>
<li>작업 권한은 <strong>Read only</strong>로 시작</li>
</ol>
</div>
<div>
<div class="card">
<p><span class="tag">알아 둘 것</span></p>
<ul>
<li>무료 플랜: 월 500크레딧, 루틴 3개 (연결한 구독 사용량은 크레딧과 따로 계산)</li>
<li>결제·게시·메시지 같은 민감한 동작은 <strong>승인을 받은 뒤</strong> 실행</li>
<li>기억(Memory)은 <code>Settings &gt; Memory</code>에서 끄거나 보관 기간을 정함</li>
</ul>
</div>
<div class="card" style="margin-top:12px">
<p><span class="tag orange">다른 모델로는</span></p>
<p>구독: <strong>ChatGPT</strong> Plus·Pro, GitHub Copilot<br />
API 키: OpenAI · Google(Gemini) · xAI · OpenRouter 등</p>
</div>

<div class="card">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>10/15 면담 20분. 2학년 학생 A(가명).
전공 과제 마감 두 번 놓침. 주 20시간 아르바이트.
교육봉사 시간 부족(60시간 중 32시간).
임용이냐 대학원이냐 고민 중.
→ 교육봉사 기관 목록 다음 주까지 보내 주기로 함.
→ 학생은 교수학습센터 학습코칭 신청하겠다고 함.
11월 둘째 주에 다시 면담.
</code></pre>

① 학생 상황 ② 고민·요청
③ 합의한 조치(누가·언제까지)
④ 다음 면담에서 확인할 것
메모에 없는 내용은 쓰지 않는다.
애매한 것은 '확인 필요'로 표시한다.
끝에 학생에게 보낼 3문장 메일 초안.
</code></pre>
<p><span class="tag green">Code 탭에 한 줄</span></p>

<div class="grid2">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[매일 08:50, 클라우드]
① 관심주제 파일 읽기  소스·키워드·내 연구

                         ← 스크립트(고정)

                         ← LLM

⑤ 메일 발송
</code></pre>
<p>논문을 찾는 일은 <strong>정해 둔 소스에서 스크립트가</strong>, 읽고 정리하는 일은 <strong>LLM이</strong> 합니다. 제가 고치는 것은 <em>관심주제 파일 하나</em>입니다.</p>

실제로는 수집 835편 → 후보 <strong>0편</strong></p>
<p>오류도 경고도 없었습니다. 원인은</p>
<ul>
<li>제목만 있는 피드를 초록 없이 채점</li>
<li>키워드가 영어뿐</li>
<li>'이미 본 논문' 기록이 너무 넓게 적용</li>
</ul>
<p>고친 뒤 후보 <strong>40~48편</strong></p>
</div>
