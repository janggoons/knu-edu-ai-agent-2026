section {
  font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  background: #FAFAF8;
  color: #1E1B2E;
  padding: 56px 68px;
  font-size: 27px;

h1 {
  font-size: 46px;
  font-weight: 900;
  color: #1E1B2E;
  margin-bottom: 6px;
}
h2 {
  font-size: 34px;
  font-weight: 700;
  color: #4338CA;
  margin-bottom: 14px;
}
h3 {
  font-size: 27px;
  font-weight: 700;
  color: #EA580C;
}
strong { color: #4338CA; }
em { color: #EA580C; font-style: normal; font-weight: 700; }
section.lead {
  background: linear-gradient(135deg, #312E81 0%, #4338CA 55%, #6D28D9 100%);
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.lead h1 { color: #FFFFFF; font-size: 52px; }
section.lead h2 { color: #FDE68A; }
section.lead p { color: #E0E7FF; }
section.part {
  background: #1E1B2E;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
section.part h1 { color: #FFFFFF; font-size: 54px; }
section.part .badge {
  width: 90px; height: 90px;
  border-radius: 50%;
  background: #F97316;
  color: #1E1B2E;
  font-size: 44px;
  font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
section.part .msg { color: #C7D2FE; font-size: 26px; margin-top: 10px; }
section.break {
  background: #FDF4E3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
section.break h1 { font-size: 60px; color: #EA580C; }
section.qa {
  background: #EEF2FF;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }

  border-radius: 16px;
  padding: 20px 24px;
}
.card.bad { border-color: #FCA5A5; background: #FEF2F2; }
.card.good { border-color: #86EFAC; background: #F0FDF4; }
.tag {
  display: inline-block;
  background: #4338CA;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.tag.orange { background: #EA580C; }
.tag.green { background: #16A34A; }
.tag.red { background: #DC2626; }
.tag.gray { background: #6B7280; }
.big { font-size: 40px; font-weight: 900; color: #4338CA; }
.center { text-align: center; }
.small { font-size: 20px; color: #6B7280; }
.warn {
  background: #FEF3C7;
  border-left: 8px solid #F59E0B;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 24px;
}
img { border-radius: 10px; }
img[alt~=&quot;border&quot;] { border: 1px solid #E5E7EB; }

.shot p { margin: 0; }
.shot img { display: block; border-radius: 0; max-width: none; }
.shot.willison { width: 560px; height: 114px; } .shot.willison img { width: 560px; margin-top: -46px; }
.shot.effective { width: 620px; height: 143px; } .shot.effective img { width: 620px; margin-top: -51px; }

.paper { background: #FFFFFF; border: 2px solid #E5E7EB; border-radius: 12px; padding: 8px; }

.paper img.h110 { max-height: 110px; }

.paper img.h200 { max-height: 200px; }
.paper img.h260 { max-height: 260px; }

.paper img.tall340 { max-height: 340px; }

.paper.gen { border-color: #C4B5FD; background: #FAF5FF; }
.paper.gen .cap { color: #6D28D9; }
table { font-size: 24px; }
ul, ol { font-size: 27px; }

.must p { font-size: 21px; margin: 0; }
.src { text-align: center; margin-top: 8px; }

.src .cap { font-size: 19px; color: #374151; margin-top: 12px; line-height: 1.45; }
.side img { display: block; width: 100%; height: auto; border: 1px solid #E5E7EB; border-radius: 8px; background: #fff; }

<div class="grid2">
<div>
<p>같은 LLM에게 <strong>역할을 나눠</strong> 맡깁니다. 에이전트마다 지침, 쓸 수 있는 도구, 맥락(기억하는 대화)이 따로입니다.</p>
<ul>
<li>예: 같은 Claude에게 '자료 찾기 담당', '요약 담당', '검토 담당'을 따로 줌</li>

<div class="shot duet">
<p><img src="img/duet/01_claude_duet_intro.png" alt="" style="width:600px;" /></p>
</div>
<div class="grid3" style="margin-top:12px">
<div class="card">
<p><span class="tag">달라진 점</span></p>
<p>지금까지는 <strong>내가 물어야</strong> 움직였습니다</p>
<p>Duet은 챙길 일이 생기면 <em>먼저 연락</em>합니다</p>
</div>
<div class="card">
<p><span class="tag orange">일하는 방식</span></p>
<ul>
<li>아침마다 <strong>짧은 브리핑</strong></li>
<li>연결된 앱을 <strong>몇 시간마다</strong> 살피고, 필요할 때만 메시지</li>
<li>따로 쓰는 <strong>가상 컴퓨터, 브라우저</strong>가 있어 노트북을 꺼도 일함</li>
</ul>
</div>
<div class="card good">
<p><span class="tag green">결재는 사람이</span></p>
<ul>

<li>증권 거래, 계좌 간 이체는 승인해도 <strong>하지 않음</strong></li>
<li>비밀번호는 보지 않고, 카드, 신분증 번호는 내보내지 않음</li>
</ul>

<h2 id="%EC%8B%A4%EC%8A%B5-%EC%A4%80%EB%B9%84-%E2%91%A0-claude-code">실습 준비 ① Claude Code</h2>
<div class="grid2">
<div>
<p><strong>Claude Code</strong>는 내 컴퓨터의 폴더를 읽고, 파일을 만들고 고치는 에이전트입니다. 폴더에 있는 <code>CLAUDE.md</code>(지침 한 장)를 먼저 읽고 일합니다.</p>
<ol>
<li><strong><a href="https://claude.com/download" target="_blank" rel="noopener">claude.com/download</a></strong> 에서 Claude 데스크톱 앱 설치 (macOS, Windows)</li>
<li>받으신 Claude 계정으로 로그인 → <strong>Code</strong> 탭</li>
<li>내려받은 <strong>실습 폴더</strong> 선택</li>
<li>파일을 고치기 전에 묻는 기본 권한 그대로 시작</li>
</ol>
<p class="small">데스크톱 앱 안에 Claude Code가 들어 있어 따로 설치하지 않아도 됩니다(VS Code 확장으로도 쓸 수 있음). 유료 구독(Pro, Max 등)이 필요합니다</p>
</div>
<div>
<div class="card">
<p><span class="tag">실습 폴더</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>AI실습/
├ 01_교육_면담정리/  CLAUDE.md, 면담메모_가상.md
├ 02_연구_브리핑/    CLAUDE.md, 관심주제.md
└ 03_행정_할일/      Aside_지시문.md
</code></pre>
<p>앞에서 본 <strong>책상(하네스)</strong>을 직접 차려 보는 셈입니다.</p>
</div>

<div>
<p><strong>Aside</strong>는 사람과 에이전트가 함께 쓰도록 만든 브라우저입니다. 로그인해 둔 사이트에서 에이전트가 직접 페이지를 읽고 일합니다.</p>
<ol>
<li><strong><a href="https://aside.com/download" target="_blank" rel="noopener">aside.com/download</a></strong> 에서 내려받아 설치 (macOS 15 이상, Windows)</li>
<li>계정 만들기 → 브라우저 데이터 가져오기는 <em>오늘은 건너뛰기</em></li>
<li><code>Settings &gt; Models &gt; Providers &gt; Connect</code> → <strong>Subscription</strong> → <strong>Claude Subscription</strong> → 팝업에서 Claude 로그인</li>
<li><code>Settings &gt; Models &gt; Task models</code>에서 기본 모델을 <strong>Claude</strong>로</li>
<li>작업 권한은 <strong>Read only</strong>로 시작</li>
</ol>

<div class="grid2">
<div class="card">
<p><span class="tag red">면담메모_가상.md</span> <span class="small">실존 인물 아님</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>10/15 면담 20분. 2학년 학생 A(가명).
전공 과제 마감 두 번 놓침. 주 20시간 아르바이트.
교육봉사 시간 부족(60시간 중 32시간).
임용이냐 대학원이냐 고민 중.
→ 교육봉사 기관 목록 다음 주까지 보내 주기로 함.
→ 학생은 교수학습센터 학습코칭 신청하겠다고 함.
11월 둘째 주에 다시 면담.
</code></pre>
</div>

<p><span class="tag">CLAUDE.md (지침 한 장)</span></p>

① 학생 상황 ② 고민, 요청
③ 합의한 조치(누가, 언제까지)
④ 다음 면담에서 확인할 것
메모에 없는 내용은 쓰지 않는다.
애매한 것은 '확인 필요'로 표시한다.
끝에 학생에게 보낼 3문장 메일 초안.
</code></pre>
<p><span class="tag green">Code 탭에 한 줄</span> <span class="small">읽기 → 표 → 저장 → 메일 초안</span></p>

<p>AI가 쓴 논문 390편을 주제가 같은 사람의 논문(우수 학회 게재)과 짝지어 비교했습니다. 구조, 논증, 증거 지표로 AI 논문을 <strong>85.9%</strong> 가려냈습니다(기존 탐지기 68.7%).</p>
<p>같은 지표가 높을수록 ICLR 심사 점수가 낮았습니다.</p>

</div>

<h2 id="e-1-%EB%B6%80%EB%A1%9D-chatgpt-%EC%9D%B4%EC%9A%A9%EA%B6%8C%EC%9D%B4%EB%A9%B4-codex%EB%A1%9C">E-1 부록: ChatGPT 이용권이면 Codex로</h2>
<div class="grid2">
<div>
<p><strong>Codex</strong>는 OpenAI가 만든 에이전트입니다. Claude Code처럼 내 폴더의 파일을 읽고 만들고 고칩니다. 지금은 ChatGPT 데스크톱 앱 안에 들어 있습니다.</p>
<ol>
<li>ChatGPT 데스크톱 앱 설치 (macOS, Windows는 Microsoft Store, Linux)</li>
<li>ChatGPT 계정으로 로그인</li>
<li>새 프로젝트를 만들거나 <strong>폴더 열기</strong> → 실습 폴더 선택</li>
<li>입력창 아래 권한을 <strong>Ask for approval</strong>로 두고 시작</li>
</ol>
<p class="small">Free, Go, Plus, Pro, Business, Edu, Enterprise 요금제에 Codex가 포함됩니다. 요금제마다 쓸 수 있는 양이 다릅니다</p>
</div>
<div>
<div class="card">
<p><span class="tag">권한 네 단계</span></p>
<ul>
<li><strong>Ask for approval</strong> 폴더 밖 파일, 인터넷은 매번 묻기 (처음엔 이것)</li>
<li><strong>Approve for me</strong> 위험해 보이는 동작만 묻기</li>
<li><strong>Full access</strong> 묻지 않고 모두 허용</li>
<li><strong>Custom</strong> <code>config.toml</code>에 정한 대로</li>
</ul>
</div>
