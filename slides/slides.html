<h2 id="%EC%8B%A4%EC%8A%B5-%EC%A4%80%EB%B9%84-%E2%91%A1-ai-%EB%B8%8C%EB%9D%BC%EC%9A%B0%EC%A0%80-aside%EC%97%90-claude-%EC%97%B0%EA%B2%B0">실습 준비 ② AI 브라우저 Aside에 Claude 연결</h2>
<div class="grid2">
<div>
<p><strong>Aside</strong> 사람과 에이전트가 함께 쓰도록 만든 브라우저. 로그인해 둔 사이트에서 에이전트가 직접 읽고 일합니다.</p>
<ol>
<li><strong>aside.com/download</strong> 에서 내려받아 설치 (macOS 15 이상 · Windows)</li>
<li>계정 만들기 → 브라우저 데이터 가져오기는 <em>오늘은 건너뛰기</em></li>
<li><code>Settings &gt; Models &gt; Providers &gt; Connect</code> → <strong>Subscription</strong> → <strong>Claude Subscription</strong> → 팝업에서 Claude 로그인</li>
<li><code>Settings &gt; Models &gt; Task models</code>에서 기본 모델을 <strong>Claude</strong>로</li>
<li>작업 권한은 <strong>Read only</strong>로 시작</li>
</ol>
</div>
<div>
<div class="card">
<p><span class="tag">알아 둘 것</span></p>
<ul>
<li>무료 플랜: 월 500크레딧, 루틴 3개 (연결한 구독 사용량은 크레딧과 별개)</li>
<li>결제·게시·메시지 같은 민감한 동작은 <strong>승인을 받은 뒤</strong> 실행</li>
<li>기억(Memory)은 <code>Settings &gt; Memory</code>에서 끄거나 보관 기간을 정함</li>
</ul>
</div>
<div class="card" style="margin-top:12px">
<p><span class="tag orange">다른 모델로는</span></p>
<p>구독: <strong>ChatGPT</strong> Plus·Pro, GitHub Copilot<br />
API 키: OpenAI · Google(Gemini) · xAI · OpenRouter 등</p>

<div class="grid2">
<div class="card">
<p><span class="tag orange">관심주제.md — 내가 채우는 곳</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>핵심 질문: 생성형 AI가 시민성·탐구 수업을
          어떻게 바꾸는가
키워드: social studies, civic education,
       generative AI, 시민교육, 사회과
소스: Theory &amp; Research in Social Education,
     사회과교육 (학술지 3~5개)
</code></pre>
<p><span class="tag">CLAUDE.md — 미리 넣어 둔 규칙</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>소스에 적은 학술지에서 최근 2주 논문만 찾는다.
논문마다 DOI 링크와 초록 기준 3줄 요약.
못 찾으면 못 찾았다고 쓴다. 지어내지 않는다.
결과는 브리핑_날짜.md로 저장한다.
</code></pre>
<p><span class="tag green">Code 탭에 한 줄</span> <code>오늘 브리핑 만들어 줘</code></p>
</div>
<div>
<p><strong>의심하기 — 세 가지 점검</strong></p>
<table>
<thead>
<tr>
<th>점검</th>
<th>방법</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>있는가</strong></td>
<td>링크·DOI 2~3개를 눌러 실제로 열리는지</td>
</tr>
<tr>
<td><strong>맞는가</strong></td>
<td>요약의 숫자 하나를 초록과 대조</td>
</tr>
<tr>
<td><strong>빠졌는가</strong></td>
<td>내가 아는 최근 논문이 목록에 있는지</td>
</tr>
</tbody>
</table>
<div class="warn" style="margin-top:12px; font-size:20px">
<p>키워드는 <strong>영문+한글</strong>, 소스는 <strong>미리 정해 두기</strong>. 둘 다 위 '조용한 실패'에서 배운 것입니다.</p>
</div>
<p class="small" style="margin-top:8px">매일 받으려면: Claude 데스크톱 앱의 <strong>예약 작업</strong>(내 PC) 또는 <strong>루틴</strong>(클라우드, 컴퓨터를 꺼도 실행)에 같은 지시 등록. 강사의 브리핑도 클라우드 루틴으로 매일 08:50에 옵니다.</p>
</div>
